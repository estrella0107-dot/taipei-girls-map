<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>台北女子地圖｜TAIPEI GIRLS MAP</title>
<meta name="description" content="台北與新北女子生活服務地圖：按摩、清粉刺、做臉、洗髮、頭皮SPA、命理諮詢。">
<style>
:root{--cream:#fbf5ec;--paper:#fffdfa;--ink:#292421;--muted:#817a74;--line:#eadfd5;--pink:#ed5672;--rose:#fff0f2}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:20;background:rgba(255,253,250,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.wrap{max-width:1180px;margin:auto;padding:18px 22px}
.nav{display:flex;align-items:center;gap:18px}.logo{font-family:Georgia,"Noto Serif TC",serif;font-size:24px;white-space:nowrap}.tagline{font-size:13px;color:#675f59;letter-spacing:1px}.navSearch{margin-left:auto;width:min(370px,34vw);padding:11px 15px;border:1px solid var(--line);border-radius:999px;background:#fff}
.hero{max-width:1180px;margin:auto;position:relative;min-height:330px;overflow:hidden;border-bottom:1px solid var(--line)}.hero img{position:absolute;right:0;top:0;width:66%;height:100%;object-fit:cover;object-position:center}.heroCopy{position:relative;z-index:2;width:45%;padding:40px 22px}.eyebrow{font-size:11px;letter-spacing:4px;color:#8c8178}h1{font-family:Georgia,"Noto Serif TC",serif;font-size:clamp(42px,5vw,68px);font-weight:500;margin:10px 0}.heroCopy p{font-size:17px;color:#5f5853}
.sectionTitle{font-family:Georgia,"Noto Serif TC",serif;font-size:30px;margin:10px 0 3px}.sub{color:var(--muted);font-size:14px;margin-bottom:14px}
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.mood{position:relative;height:210px;border:0;border-radius:15px;overflow:hidden;padding:0;cursor:pointer;background:#ddd}.mood img{width:100%;height:100%;object-fit:cover;transition:.25s}.mood:hover img,.mood.active img{transform:scale(1.035)}.mood:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 38%,rgba(22,18,16,.94) 100%)}.moodCopy{position:absolute;z-index:2;left:15px;bottom:15px;color:white;text-align:left;font-size:18px;font-weight:650}.moodCopy small{display:block;font-size:13px;margin-top:3px;font-weight:500}
.chips{display:flex;gap:8px;overflow:auto;padding:14px 0}.chip{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 18px;white-space:nowrap;cursor:pointer}.chip.active{border-color:#f2a0af;background:var(--rose);color:#b9485c}
.filters{display:grid;grid-template-columns:1.8fr 1fr;gap:10px;margin:8px 0 15px}input,select{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;font:inherit}.stats{font-size:12px;color:#8b837d;margin:8px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:14px;box-shadow:0 7px 24px rgba(80,60,45,.045)}.card h2{font-size:18px;margin:4px 0}.loc{font-size:12px;color:#777}.tags{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}.tag{font-size:11px;padding:5px 8px;border-radius:999px;background:#f6f1e9;border:1px solid #ebe1d6}.vibe{background:#fff}.info{font-size:12px;line-height:1.65;color:#666}
.ratings{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:11px 0}.rating{border-radius:11px;padding:10px;background:var(--rose);font-size:12px}.rating.google{background:#fff;border:1px solid var(--line)}.rating b{display:block;font-size:14px;color:#d84e68}.google b{color:#6b625b}
.socials{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 8px}.socialBtn{border:1px solid #ded5cc;background:#fff;color:#625a54;border-radius:999px;padding:7px 10px;text-decoration:none;font-size:11px}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{border:1px solid #ef8da0;background:#fff;color:#d94c67;border-radius:10px;padding:9px 12px;text-decoration:none;font-size:12px;cursor:pointer}.btn.primary{background:var(--pink);color:white;border-color:var(--pink)}.community{font-size:12px;line-height:1.6;background:#faf6f1;border-radius:10px;padding:9px;margin:8px 0;color:#645d57}
.modal{display:none;position:fixed;inset:0;z-index:100;background:rgba(35,28,25,.45);align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.sheet{width:min(520px,100%);background:#fff;border-radius:20px;padding:20px;max-height:90vh;overflow:auto}.sheetTop{display:flex;justify-content:space-between}.close{border:0;background:none;font-size:25px}.stars{display:flex;gap:4px;margin:13px 0}.star{border:0;background:none;font-size:34px;color:#ccc;cursor:pointer}.star.on{color:var(--pink)}.reviewTags{display:flex;gap:6px;flex-wrap:wrap}.reviewTag{border:1px solid #ddd;background:#fff;border-radius:999px;padding:7px 10px}.reviewTag.on{background:var(--rose);border-color:#ef9bac;color:#c94d64}textarea{width:100%;min-height:90px;margin-top:13px;padding:11px;border:1px solid #ddd;border-radius:10px;font:inherit}.submit{width:100%;padding:12px;margin-top:12px;border:0;border-radius:10px;background:var(--pink);color:#fff}
footer{padding:42px 0;color:#8a817b;font-size:11px}
@media(max-width:720px){.wrap{padding:14px 12px}.tagline,.navSearch{display:none}.logo{font-size:19px}.hero{min-height:250px}.hero img{position:relative;width:100%;height:190px;object-fit:cover;object-position:center}.heroCopy{width:100%;padding:18px 14px 8px}h1{font-size:38px;margin:6px 0}.heroCopy p{font-size:13px}.sectionTitle{font-size:24px}.moods{grid-template-columns:repeat(2,1fr)}.mood{height:176px}.moodCopy{left:14px;right:10px;bottom:16px;font-size:16px;line-height:1.2}.moodCopy small{font-size:12px;line-height:1.25;margin-top:4px}.mood:last-child{grid-column:1/-1}.grid{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}.ratings{grid-template-columns:1fr 1fr}}
</style></head><body>
<header><div class="wrap nav"><div class="logo">🐱 台北女子地圖 <small style="font-size:9px;letter-spacing:2px;color:#b36c58">TAIPEI GIRLS MAP</small></div><div class="tagline">屬於女生的生活服務地圖 ♡</div><input class="navSearch" placeholder="搜尋店家名稱、服務項目或地區…"></div></header>
<section class="hero"><div class="heroCopy"><div class="eyebrow">TAIPEI GIRLS MAP</div><h1>台北女子地圖</h1><p>屬於女生的生活服務地圖 ♡</p></div><img src="hero-v3.jpg" alt="台北女子地圖手繪大貓與女孩"></section>
<main class="wrap"><h2 class="sectionTitle">今天的你，想找什麼？ ✨</h2><div class="sub">不論是放鬆、變美，還是找回內在力量，都有適合你的地方。</div>
<div class="moods" id="moods">
<button class="mood" data-cats="按摩"><img src="menu-massage.jpg" alt="今天好累，按摩"><span class="moodCopy">💆 今天好累<small>→ 按摩</small></span></button>
<button class="mood" data-cats="洗髮"><img src="menu-wash.jpg" alt="只想洗頭，洗髮"><span class="moodCopy">🫧 只想洗頭<small>→ 洗髮</small></span></button>
<button class="mood" data-cats="清粉刺|做臉"><img src="menu-face.jpg" alt="臉需要急救，清粉刺做臉"><span class="moodCopy">✨ 臉需要急救<small>→ 清粉刺／做臉</small></span></button>
<button class="mood" data-cats="頭皮SPA"><img src="menu-scalp.jpg" alt="想放空一下，頭皮SPA"><span class="moodCopy">🌿 想放空一下<small>→ 頭皮 SPA</small></span></button>
<button class="mood" data-cats="命理諮詢"><img src="menu-tarot.jpg" alt="最近有點迷惘，命理諮詢"><span class="moodCopy">🔮 最近有點迷惘<small>→ 命理諮詢</small></span></button></div>
<div class="chips" id="chips"><button class="chip active" data-cat="">▦ 全部店家</button><button class="chip" data-cat="按摩">按摩</button><button class="chip" data-cat="清粉刺">清粉刺</button><button class="chip" data-cat="做臉">做臉</button><button class="chip" data-cat="洗髮">洗髮</button><button class="chip" data-cat="頭皮SPA">頭皮 SPA</button><button class="chip" data-cat="命理諮詢">命理諮詢</button></div>
<div class="filters"><input id="q" placeholder="搜尋店家、區域、服務、口碑標籤…"><select id="city"><option value="">台北＋新北</option><option>台北市</option><option>新北市</option></select></div><div class="stats" id="count"></div><section class="grid" id="grid"></section>
<footer>台北女子地圖整理店家公開商業資訊與可辨識來源的社群推薦摘要。地址、營業狀態與預約資訊可能變動，前往前請再次向店家確認。</footer></main>
<div class="modal" id="modal"><div class="sheet"><div class="sheetTop"><div><b>分享你的真實體驗</b><div id="shop" class="loc"></div></div><button class="close" id="close">×</button></div><div class="stars" id="stars"><button class="star" data-star="1">★</button><button class="star" data-star="2">★</button><button class="star" data-star="3">★</button><button class="star" data-star="4">★</button><button class="star" data-star="5">★</button></div><div class="reviewTags" id="rtags"><button class="reviewTag">不推銷</button><button class="reviewTag">手法很好</button><button class="reviewTag">環境舒服</button><button class="reviewTag">價格合理</button><button class="reviewTag">女性友善</button><button class="reviewTag">預約方便</button><button class="reviewTag">會再訪</button></div><textarea id="reviewText" maxlength="200" placeholder="分享一句心得（選填，最多 200 字）"></textarea><button class="submit" id="submit">送出評價</button><div class="loc" style="margin-top:8px">體驗版：評價暫存在這台裝置；正式公開前將接上資料庫與審核。</div></div></div>
<script>
let data=[],cat="",moodCats=[],reviewShop="",reviewStars=0;
const esc=s=>String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function render(){let q=document.querySelector("#q").value.trim().toLowerCase(),city=document.querySelector("#city").value;let rows=data.filter(x=>(!city||x.city===city)&&(!cat||x.category.includes(cat))&&(!moodCats.length||moodCats.some(c=>x.category.includes(c)))&&(!q||JSON.stringify(x).toLowerCase().includes(q)));count.textContent=`共 ${rows.length} 間店家`;grid.innerHTML=rows.map(x=>`<article class="card"><h2>${esc(x.name)}</h2><div class="loc">📍 ${esc(x.city)} ${esc(x.district)}・${esc(x.address)}</div><div class="tags">${x.category.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}${(x.tags||[]).map(t=>`<span class="tag vibe">#${esc(t)}</span>`).join("")}</div>${x.communityReview?`<div class="community"><b>女子口碑</b>「${esc(x.communityReview)}」</div>`:""}<div class="ratings"><div class="rating"><span>✦ 台北女子評價</span><b>尚待累積</b></div><div class="rating google"><span>Google 評價</span>${Number.isFinite(x.googleRating)&&x.googleReviewCount>0?`<b>⭐ ${x.googleRating.toFixed(1)} <small>(${x.googleReviewCount} 則)</small></b>`:`<b>尚無可驗證評分</b>`}</div></div><div class="info">${esc(x.note||"")}</div><div class="socials">${x.instagram?`<a class="socialBtn" target="_blank" rel="noopener" href="${esc(x.instagram)}">Instagram</a>`:""}${x.threads?`<a class="socialBtn" target="_blank" rel="noopener" href="${esc(x.threads)}">Threads</a>`:""}${x.line?`<a class="socialBtn" target="_blank" rel="noopener" href="${esc(x.line)}">LINE</a>`:""}${x.sourceUrl?`<a class="socialBtn" target="_blank" rel="noopener" href="${esc(x.sourceUrl)}">官方資訊</a>`:""}</div><div class="actions"><button class="btn rate" data-shop="${esc(x.name)}">☆ 我要評價</button>${x.bookingUrl?`<a class="btn primary" target="_blank" href="${esc(x.bookingUrl)}">立即預約</a>`:""}<a class="btn" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(x.address)}">看地圖</a></div></article>`).join("")}
fetch("data.json?v=20261005-1638",{cache:"no-store"}).then(r=>r.json()).then(x=>{data=Array.isArray(x)?x:[];cat="";moodCats=[];q.value="";city.value="";document.querySelectorAll(".chip,.mood").forEach(el=>el.classList.remove("active"));document.querySelector('.chip[data-cat=""]').classList.add("active");render()}).catch(()=>{count.textContent="店家資料載入失敗，請重新整理頁面"});
q.addEventListener("input",render);city.addEventListener("change",render);
chips.addEventListener("click",e=>{let b=e.target.closest("[data-cat]");if(!b)return;cat=b.dataset.cat;moodCats=[];document.querySelectorAll(".chip,.mood").forEach(x=>x.classList.remove("active"));b.classList.add("active");render()});
moods.addEventListener("click",e=>{let b=e.target.closest(".mood");if(!b)return;moodCats=b.dataset.cats.split("|");cat="";document.querySelectorAll(".chip,.mood").forEach(x=>x.classList.remove("active"));b.classList.add("active");render()});
grid.addEventListener("click",e=>{let b=e.target.closest(".rate");if(!b)return;reviewShop=b.dataset.shop;reviewStars=0;shop.textContent=reviewShop;document.querySelectorAll(".star,.reviewTag").forEach(x=>x.classList.remove("on"));reviewText.value="";modal.classList.add("open")});
close.addEventListener("click",()=>modal.classList.remove("open"));stars.addEventListener("click",e=>{let b=e.target.closest(".star");if(!b)return;reviewStars=+b.dataset.star;document.querySelectorAll(".star").forEach(x=>x.classList.toggle("on",+x.dataset.star<=reviewStars))});rtags.addEventListener("click",e=>{let b=e.target.closest(".reviewTag");if(b)b.classList.toggle("on")});
submit.addEventListener("click",()=>{if(!reviewStars)return alert("請先選擇 1–5 顆星");let a=JSON.parse(localStorage.getItem("tgm_reviews")||"[]");a.push({shop:reviewShop,stars:reviewStars,tags:[...document.querySelectorAll(".reviewTag.on")].map(x=>x.textContent),text:reviewText.value.trim(),createdAt:new Date().toISOString()});localStorage.setItem("tgm_reviews",JSON.stringify(a));modal.classList.remove("open");alert("謝謝你的分享！體驗版評價已儲存在這台裝置。")})
</script></body></html>
